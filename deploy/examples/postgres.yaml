# PostgreSQL backed up every 6 hours with pg_dumpall, run inside the
# postgres container itself. Output is plain SQL, so oap-backup gzips it:
# files are named backup-<YYYYMMDDHHMMSS>.sql.gz; the newest 8 are kept.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: db
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        oap/backup-command: "pg_dumpall -U postgres"
        oap/backup-schedule: "0 */6 * * *"
        oap/backup-file-folder: "db/postgres"
        oap/backup-file-extension: ".sql"
        oap/backup-retention-keep-last: "8"
        oap/backup-container: "postgres"
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
